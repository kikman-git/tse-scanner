[project]
name = "tse-scanner"
version = "0.0.1"
description = "踏み上げ (fumiage) short-squeeze setup scanner for the Tokyo Stock Exchange"
readme = "README.md"
requires-python = ">=3.12"
# Stack is locked by: Python end-to-end, J-Quants client, pandas/pandas-ta,
# DuckDB (+ Parquet) store, FastAPI + Next.js view layer.
dependencies = [
    "pandas>=2.2",
    "numpy>=2.2.6",          # required by current pandas-ta
    "pandas-ta>=0.3.14b0",
    "duckdb>=1.0",
    "pyarrow>=16",
    "httpx>=0.27",           # JPX free-file downloads + J-Quants REST
    "pdfplumber>=0.11",      # parse JPX 信用取引残高 weekly PDF (free fuel)
    "xlrd>=2.0",             # read JPX data_j.xls universe (legacy.xls)
    "yfinance>=0.2.40",      # free daily OHLCV (Yahoo; Stooq now anti-bot walled)
    "python-dotenv>=1.0",
    "jpholiday>=1.0.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn>=0.30"]          # view-layer split (serves web/)
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tse-scanner = "tse_scanner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tse_scanner"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
